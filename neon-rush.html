<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080c16">
<title>Neon Rush — Endless Racer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap');
:root{color-scheme:dark;--cyan:#55f2ea;--pink:#ff4f8b;--ink:#080c16}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#182338 0%,#0b1120 52%,#080c16 100%);color:#f3f7ff;font-family:'Barlow Condensed',sans-serif;display:grid;place-items:center;overflow:hidden}.wrap{width:min(1100px,100vw);padding:18px 25px 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 auto 13px;max-width:950px}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border:1px solid #55f2ea66;background:#55f2ea12;border-radius:12px;display:grid;place-items:center;color:var(--cyan);box-shadow:0 0 25px #55f2ea22}.logo svg{width:23px}.eyebrow,.label,.hint,.key{font-family:'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase}.eyebrow{font-size:9px;color:#8190a6;margin-bottom:2px}.title{font-size:23px;line-height:1;font-weight:900;letter-spacing:.11em}.title b{color:var(--cyan);font-weight:900}.stats{display:flex;gap:27px;align-items:center}.stat{text-align:right}.label{font-size:9px;color:#8290a6}.value{font-size:21px;font-weight:800;letter-spacing:.04em}.value small{font-size:11px;color:#8491a6;font-weight:600}.game-shell{position:relative;max-width:950px;margin:auto;border:1px solid #314057;border-radius:14px;overflow:hidden;box-shadow:0 30px 90px #0009,0 0 45px #55f2ea0c;background:#111927;aspect-ratio:16/9}.game-shell:after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:14px;box-shadow:inset 0 0 50px #05091466}.game-shell canvas{width:100%;height:100%;display:block}.hud{position:absolute;z-index:2;inset:18px 20px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.pill{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid #ffffff17;background:#0a101dcc;border-radius:8px;font:10px 'DM Mono',monospace;letter-spacing:.12em;color:#bac8dc;backdrop-filter:blur(8px)}.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px var(--cyan)}.nitrobox{width:165px}.nitrohead{display:flex;justify-content:space-between;align-items:center;font:9px 'DM Mono',monospace;letter-spacing:.14em;color:#b1bdd0}.nitrohead span:last-child{color:var(--cyan)}.bar{height:5px;background:#ffffff17;border-radius:99px;margin-top:7px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#39d8cc,#82fff0);box-shadow:0 0 12px #55f2ea88;border-radius:99px;transition:width .12s}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;background:linear-gradient(90deg,#080c16a8,#080c166b,#080c16a8);transition:opacity .25s}.overlay.hidden{opacity:0;pointer-events:none}.card{text-align:center;width:min(430px,90%);padding:27px 24px 23px;border:1px solid #ffffff1b;border-radius:15px;background:#0a1019df;box-shadow:0 20px 65px #0008;backdrop-filter:blur(12px)}.card .eyebrow{color:var(--cyan);font-size:10px}.card h1{font-size:clamp(37px,6vw,57px);line-height:.95;letter-spacing:.055em;margin:12px 0 8px;font-weight:900;text-transform:uppercase}.card h1 span{color:var(--cyan)}.card p{font-size:15px;color:#9caabe;margin:9px auto 19px;line-height:1.3}.cta{border:0;border-radius:7px;padding:11px 25px;background:var(--cyan);color:#081219;font:800 14px 'Barlow Condensed',sans-serif;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 25px #55f2ea34;transition:transform .15s,box-shadow .15s}.cta:hover{transform:translateY(-2px);box-shadow:0 4px 30px #55f2ea66}.keys{margin-top:17px;color:#8795aa;font:9px 'DM Mono',monospace;letter-spacing:.06em}.key{display:inline-grid;place-items:center;min-width:23px;padding:3px 5px;margin:0 2px;border:1px solid #ffffff28;border-radius:4px;color:#d8e1ed;font-size:9px}.mobile-controls{display:none}.bottom{max-width:950px;margin:12px auto 0;display:flex;align-items:center;justify-content:space-between;color:#77869b;font:9px 'DM Mono',monospace;letter-spacing:.08em}.legend{display:flex;gap:18px}.legend span{display:flex;align-items:center;gap:6px}.swatch{width:8px;height:8px;border-radius:2px;background:var(--pink)}.swatch.cyan{background:var(--cyan)}@media(max-width:650px){.wrap{padding:10px 10px 12px}.top{margin-bottom:9px}.logo{width:34px;height:34px}.title{font-size:19px}.stats{gap:13px}.value{font-size:17px}.label{font-size:8px}.game-shell{aspect-ratio:4/5;max-height:68vh}.hud{inset:11px 10px auto}.pill{font-size:8px;padding:7px 8px}.nitrobox{width:112px}.bottom{font-size:8px}.legend{gap:10px}.mobile-controls{display:flex;position:absolute;z-index:3;left:10px;right:10px;bottom:11px;justify-content:space-between;align-items:flex-end;pointer-events:none}.touch-group{display:flex;gap:8px;pointer-events:auto}.touch-btn{width:56px;height:50px;border-radius:10px;border:1px solid #ffffff35;background:#09101acc;color:#e7f3ff;font-size:22px;display:grid;place-items:center;touch-action:none;user-select:none}.touch-btn.boost{width:84px;color:var(--cyan);font:800 10px 'DM Mono',monospace;letter-spacing:.1em;border-color:#55f2ea55}.card{padding:22px 15px}.keys{display:none}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15.5 6.8 8h10.4l1.8 7.5M4 15.5h16v3H4zM7 8l1.5-3h7L17 8M7 18.5v1M17 18.5v1"/><path d="M8 12h8"/></svg></div><div><div class="eyebrow">Arcade // Endless</div><div class="title">NEON <b>RUSH</b></div></div></div><div class="stats"><div class="stat"><div class="label">Distance</div><div class="value"><span id="distance">00000</span><small> m</small></div></div><div class="stat"><div class="label">Best run</div><div class="value"><span id="best">00000</span><small> m</small></div></div></div></header>
<div class="game-shell"><canvas id="game"></canvas><div class="hud"><div class="pill"><i class="dot"></i><span id="status">READY TO RACE</span></div><div class="pill nitrobox"><div style="width:100%"><div class="nitrohead"><span>NITRO</span><span id="nitroText">100%</span></div><div class="bar"><div class="fill" id="nitroFill"></div></div></div></div></div>
<div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="cardTag">MIDNIGHT CIRCUIT · 01</div><h1 id="cardTitle">Own the<br><span>night.</span></h1><p id="cardCopy">Dodge traffic. Burn nitro. See how far you can go.</p><button class="cta" id="start">Start your engine</button><div class="keys"><span class="key">←</span><span class="key">→</span> steer <span style="margin-left:9px" class="key">SPACE</span> nitro</div></div></div>
<div class="mobile-controls"><div class="touch-group"><button class="touch-btn" data-control="left">←</button><button class="touch-btn" data-control="right">→</button></div><div class="touch-group"><button class="touch-btn boost" data-control="nitro">NITRO ⚡</button></div></div></div>
<footer class="bottom"><div class="legend"><span><i class="swatch"></i>TRAFFIC</span><span><i class="swatch cyan"></i>YOUR RIDE</span></div><div>ARROWS / A D TO STEER &nbsp;·&nbsp; SPACE TO BOOST</div></footer></main>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');const distanceEl=document.getElementById('distance'),bestEl=document.getElementById('best'),nitroFill=document.getElementById('nitroFill'),nitroText=document.getElementById('nitroText'),status=document.getElementById('status'),title=document.getElementById('cardTitle'),copy=document.getElementById('cardCopy'),tag=document.getElementById('cardTag');let w=960,h=540,dpr=1,active=false,last=0,dist=0,best=+(localStorage.getItem('neonRushBest')||0),nitro=100,boosting=false,spawn=0,shake=0,lines=[],traffic=[],particles=[],player={x:.5,tilt:0};bestEl.textContent=String(best).padStart(5,'0');
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;w=r.width;h=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);lines=[];for(let y=-30;y<h+50;y+=78)lines.push(y)}window.addEventListener('resize',resize);resize();
const road=()=>({cx:w*.5,top:w*.29,bottom:w*.83});function pathRoad(){const r=road(),topY=h*.12;ctx.beginPath();ctx.moveTo(r.cx-r.top/2,topY);ctx.lineTo(r.cx+r.top/2,topY);ctx.lineTo(r.cx+r.bottom/2,h);ctx.lineTo(r.cx-r.bottom/2,h);ctx.closePath();return r}
function drawBg(dt){ctx.fillStyle='#121d26';ctx.fillRect(0,0,w,h);let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#1b2c32');grad.addColorStop(.5,'#14252a');grad.addColorStop(1,'#0c191e');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h); // skyline silhouettes
const horizon=h*.12;for(let i=0;i<26;i++){let bw=w/23,bx=((i*67)%w),bh=25+((i*43)%76);ctx.fillStyle=i%2?'#15242a':'#17272c';ctx.fillRect(bx,horizon-bh,bw,bh);if(i%3===0){ctx.fillStyle='#55f2ea18';for(let yy=horizon-bh+9;yy<horizon-5;yy+=12)ctx.fillRect(bx+6,yy,3,3)}}
ctx.fillStyle='#101b20';ctx.fillRect(0,horizon,w,h-horizon);const r=pathRoad();ctx.fillStyle='#202632';ctx.fill(); // road edge glow
ctx.lineWidth=3;ctx.strokeStyle='#ff4f8b';ctx.shadowColor='#ff4f8b';ctx.shadowBlur=9;ctx.stroke();ctx.shadowBlur=0;
// perspective lane markers
for(let i=0;i<2;i++){let x1=r.cx-r.top/2+r.top/3*(i+1),x2=r.cx-r.bottom/2+r.bottom/3*(i+1);ctx.strokeStyle='#c1d0dc22';ctx.lineWidth=2;ctx.setLineDash([19,17]);ctx.beginPath();ctx.moveTo(x1,h*.12);ctx.lineTo(x2,h);ctx.stroke();ctx.setLineDash([])}
const speed=(active?1:0.27)*(boosting?1.9:1)*(150+Math.min(dist*.09,220));for(let i=0;i<lines.length;i++){lines[i]+=speed*dt/1000;if(lines[i]>h+30)lines[i]=-40;let p=lines[i]/h,half=r.top/2+(r.bottom-r.top)/2*p,xL=r.cx-half;ctx.fillStyle=i%2?'#ecf3f222':'#f2f6fb2c';ctx.fillRect(xL-11,lines[i],5,Math.max(2,8*p));ctx.fillRect(xL+half*2+6,lines[i],5,Math.max(2,8*p))}if(boosting&&active){ctx.strokeStyle='#7bfff055';ctx.lineWidth=1;for(let i=0;i<22;i++){let x=Math.random()*w,y=Math.random()*h;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(x-w/2)*.06,y+22+Math.random()*55);ctx.stroke()}}}
function car(x,y,scale,color,playerCar=false){ctx.save();ctx.translate(x,y);let cw=34*scale,ch=59*scale;if(playerCar&&boosting){ctx.fillStyle='#55f2ea88';ctx.shadowColor='#55f2ea';ctx.shadowBlur=24;ctx.beginPath();ctx.ellipse(0,ch*.7,cw*.4,22*scale,0,0,7);ctx.fill();ctx.shadowBlur=0}ctx.fillStyle='#070b10';ctx.beginPath();ctx.roundRect(-cw*.62,-ch*.3,cw*.26,ch*.42,3*scale);ctx.roundRect(cw*.36,-ch*.3,cw*.26,ch*.42,3*scale);ctx.roundRect(-cw*.62,ch*.28,cw*.26,ch*.4,3*scale);ctx.roundRect(cw*.36,ch*.28,cw*.26,ch*.4,3*scale);ctx.fill();ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=playerCar?13:3;ctx.beginPath();ctx.roundRect(-cw/2,-ch/2,cw,ch,8*scale);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=playerCar?'#a1fff5':'#dce7ed';ctx.beginPath();ctx.moveTo(-cw*.34,-ch*.23);ctx.lineTo(cw*.34,-ch*.23);ctx.lineTo(cw*.27,ch*.08);ctx.lineTo(-cw*.27,ch*.08);ctx.closePath();ctx.fill();ctx.fillStyle='#192732';ctx.beginPath();ctx.moveTo(-cw*.27,ch*.15);ctx.lineTo(cw*.27,ch*.15);ctx.lineTo(cw*.35,ch*.34);ctx.lineTo(-cw*.35,ch*.34);ctx.closePath();ctx.fill();ctx.fillStyle=playerCar?'#dffffa':'#ffe0b3';ctx.fillRect(-cw*.39,-ch*.47,cw*.22,3*scale);ctx.fillRect(cw*.17,-ch*.47,cw*.22,3*scale);ctx.fillStyle='#ff4268';ctx.fillRect(-cw*.39,ch*.4,cw*.22,3*scale);ctx.fillRect(cw*.17,ch*.4,cw*.22,3*scale);ctx.restore()}
function trafficCar(dt){const r=road(),lanes=[-.31,0,.31],lane=lanes[Math.floor(Math.random()*3)],yy=-40;traffic.push({lane,y:yy,s:0.72,color:['#f5ad57','#b876e8','#57a9f2','#ef647e'][Math.floor(Math.random()*4)],speed:.7+Math.random()*.42})}
function drawTraffic(dt){const r=road();for(let i=traffic.length-1;i>=0;i--){let a=traffic[i];a.y+=(115+Math.min(dist*.045,150))*a.speed*dt/1000;let p=Math.max(0,Math.min(1,(a.y-h*.12)/(h*.88))),half=r.top/2+(r.bottom-r.top)/2*p,x=r.cx+a.lane*half*1.65;car(x,a.y,.54+p*.55,a.color);if(active&&Math.abs(a.y-h*.79)<36&&Math.abs(x-w*player.x)<35){active=false;status.textContent='RUN OVER';if(Math.floor(dist)>best){best=Math.floor(dist);localStorage.setItem('neonRushBest',best);bestEl.textContent=String(best).padStart(5,'0')}title.innerHTML='Wipeout<span>.</span>';copy.textContent=`You made it ${Math.floor(dist)} meters. Ready for another run?`;tag.textContent='THE NIGHT WINS THIS ROUND';startBtn.textContent='Race again';overlay.classList.remove('hidden')}if(a.y>h+60)traffic.splice(i,1)}}
function updateUI(){distanceEl.textContent=String(Math.floor(dist)).padStart(5,'0');nitroFill.style.width=nitro+'%';nitroText.textContent=Math.ceil(nitro)+'%';nitroFill.style.background=nitro<20?'linear-gradient(90deg,#ff4f8b,#ff86ad)':'linear-gradient(90deg,#39d8cc,#82fff0)'}
function frame(t){let dt=Math.min(40,t-last||16);last=t;drawBg(dt);if(active){dist+=dt*(boosting?0.026:0.014);spawn-=dt;if(spawn<=0){trafficCar();spawn=Math.max(420,1100-dist*1.6)*(0.7+Math.random()*.6)}if(boosting)nitro=Math.max(0,nitro-dt*.027);else nitro=Math.min(100,nitro+dt*.008);player.x+=(target-player.x)*Math.min(1,dt*.009);player.x=Math.max(.34,Math.min(.66,player.x));updateUI()}drawTraffic(dt);car(w*player.x,h*.79,1.05,'#55f2ea',true);requestAnimationFrame(frame)}let target=.5;
function begin(){dist=0;nitro=100;spawn=500;traffic=[];player.x=.5;target=.5;active=true;boosting=false;status.textContent='FULL THROTTLE';title.innerHTML='Own the<br><span>night.</span>';overlay.classList.add('hidden');updateUI()}
startBtn.addEventListener('click',begin);window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')target-=.075;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')target+=.075;if(e.code==='Space'&&active)boosting=nitro>2;if(!active&&e.key==='Enter')begin()});window.addEventListener('keyup',e=>{if(e.code==='Space')boosting=false});document.querySelectorAll('[data-control]').forEach(b=>{const ctl=b.dataset.control;const down=e=>{e.preventDefault();if(ctl==='left')target-=.105;if(ctl==='right')target+=.105;if(ctl==='nitro')boosting=active&&nitro>2};const up=e=>{e.preventDefault();if(ctl==='nitro')boosting=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)});requestAnimationFrame(frame)})();
</script></body></html>
